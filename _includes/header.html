{% assign home_path = '/' | relative_url %}
<header class="topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="{{ home_path }}#about">{{ site.author.name }}</a>

    <nav class="top-nav" id="topNav" aria-label="Primary">
      <a data-section="about" href="{{ home_path }}#about">About</a>
      <a data-section="experience" href="{{ home_path }}#experience">Experience</a>
      <a data-section="project" href="{{ home_path }}#project">Featured</a>
      <a data-section="work" href="{{ home_path }}#work">Projects</a>
      <a data-section="skills" href="{{ home_path }}#skills">Skills</a>
      <a data-section="education" href="{{ home_path }}#education">Education</a>
      <a data-section="contact" href="{{ home_path }}#contact">Contact</a>
    </nav>

    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="mobilePanel">Menu</button>
  </div>
</header>

<div class="mobile-panel" id="mobilePanel">
  <a data-section="about" href="{{ home_path }}#about">About</a>
  <a data-section="experience" href="{{ home_path }}#experience">Experience</a>
  <a data-section="project" href="{{ home_path }}#project">Featured</a>
  <a data-section="work" href="{{ home_path }}#work">Projects</a>
  <a data-section="skills" href="{{ home_path }}#skills">Skills</a>
  <a data-section="education" href="{{ home_path }}#education">Education</a>
  <a data-section="contact" href="{{ home_path }}#contact">Contact</a>
  <div class="socials">
    <a href="{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
    <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:{{ site.author.email }}">Email</a>
  </div>
</div>
